name: Release

# Manual only. A tag push must not publish by itself: a tag is cheap to create
# by accident, and publishing to npm is not reversible.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.5.0. Must already exist and be pushed.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: verify and publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and for signed provenance.
      # This is what lets the job publish WITHOUT any long-lived npm token.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.tag }}
          # Provenance records the commit that produced the artifact, so the
          # checkout has to be the real one rather than a shallow synthetic.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs a recent npm. The runner's bundled version
      # lags, so pin one known to support it rather than hoping.
      - name: use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1

      - run: npm ci

      # Publish only what passes the same gates as CI. A release is the worst
      # possible moment to discover a red suite.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - name: runtime dependency audit (must be clean)
        run: npm audit --omit=dev --audit-level=low

      # The tag and package.json must agree. They drift when a release is cut by
      # hand, and the mismatch is invisible until someone installs the wrong one.
      - name: tag matches package version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${{ inputs.tag }}"
          if [ "v$PKG" != "$TAG" ]; then
            echo "package.json is $PKG but the tag is $TAG"
            exit 1
          fi

      - name: generate SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-${{ inputs.tag }}
          path: sbom.cyclonedx.json

      # Trusted publishing is the intended path: the registry checks this
      # workflow's OIDC identity against the trusted publisher configured on the
      # package, so there is no long-lived credential to leak or rotate. It needs
      # a one-time setup on npmjs.com (package settings, trusted publisher,
      # GitHub Actions, this repository, this workflow filename). Until that
      # exists the registry answers a publish with a 404 that reads as "not
      # found" but means "not permitted", so NPM_TOKEN stands in when it is set.
      # Provenance is signed either way: it is minted from this run's OIDC
      # claims, not from whatever credential authenticated the upload.
      - name: publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
