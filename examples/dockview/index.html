<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenAlgo MMT Terminal</title>
  <link rel="stylesheet" href="../../node_modules/dockview-core/dist/styles/dockview.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121418;
      color: #e1e3e6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }
    #topbar {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      background-color: #181b20;
      border-bottom: 1px solid #2b2f36;
    }
    button {
      background: #2a2e39;
      color: #d1d4dc;
      border: 1px solid #434651;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #363a45;
    }
    #dockview-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 40px);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "dockview-core": "../../node_modules/dockview-core/dist/package/main.esm.mjs",
        "dockview-core/dist/styles/dockview.css": "../../node_modules/dockview-core/dist/styles/dockview.css",
        "openalgo-charts": "../../dist/openalgo-charts.mjs",
        "openalgo-charts/widget": "../../dist/openalgo-charts.widget.mjs",
        "openalgo-charts/indicators": "../../dist/openalgo-charts.indicators.mjs"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <button id="btn-add">Add Chart</button>
      <button id="btn-reset">Reset Layout</button>
    </div>
    <div id="dockview-container" class="dockview-theme-dark"></div>
  </div>

  <script type="module">
    import '../../dist/openalgo-charts.indicators.mjs';
    import { TerminalApp } from './src/TerminalApp.js';
    import { SampleMarketDataFeed } from '../sample-feed.js';

    const feed = new SampleMarketDataFeed('./data/');
    const terminal = new TerminalApp('dockview-container', feed);

    document.getElementById('btn-add').addEventListener('click', () => {
      terminal.addChart('TCS', '5m');
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      terminal.resetLayout();
    });
  </script>
</body>
</html>
