<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenAlgo Charts: Phase 9, chart trading (write)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0e12; color: #c7ccd8;
      font: 13px/1.4 system-ui, sans-serif; }
    .bar { padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
    button { background: #1c2030; color: #c7ccd8; border: 1px solid #2a3046; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
    .buy { border-color: #26a69a; color: #26a69a; } .sell { border-color: #ef5350; color: #ef5350; }
    .badge { padding: 2px 8px; border-radius: 4px; background: #2a2030; color: #f0a020; font-weight: 600; }
    #chart { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; cursor: crosshair; }
    #log { margin-left: auto; opacity: .8; }
  </style>
</head>
<body>
  <div class="bar">
    <strong>Phase 9</strong>
    <span class="badge">ANALYZER</span>
    <button class="buy" id="buy">Buy (mkt)</button>
    <button class="sell" id="sell">Sell (mkt)</button>
    <button id="limit">Place limit below</button>
    <span style="opacity:.6">drag the limit / SL / TP lines to modify · click the pill's close box to cancel</span>
    <span id="log"></span>
  </div>
  <div id="chart"></div>

  <script type="module">
    import { createChart, generateBars } from '../dist/openalgo-charts.mjs';
    import { OrderEngine, TradeController, FakeBroker } from '../dist/openalgo-charts.trade.mjs';

    const SYM = 'SIM';
    const bars = generateBars(1_705_286_700, 300, 60);
    const last = bars[bars.length - 1].close;
    const chart = createChart(document.getElementById('chart'), { priceAxisWidth: 130 });
    chart.addSeries('candlestick').setData(bars);

    const broker = new FakeBroker();
    const tc = new TradeController(chart.tradeHost(0));
    // The last book the broker reported, and the prices of lines being dragged.
    // A drag previews on top of the book and writes nothing until release.
    let book = { orders: [], positions: [] };
    const drafts = new Map();
    function draw() {
      const orders = book.orders.map((o) => {
        const price = drafts.get('order:' + o.id);
        return price === undefined ? o : { ...o, ...dragged(o, price) };
      });
      tc.reconcile(orders, book.positions, { symbol: SYM, exchange: 'NSE' });
    }
    // What a drag to `price` changes, which the preview draws and the release
    // sends. The line sits at the trigger when there is one, so the trigger
    // follows the pointer, and a stop-limit's limit keeps its gap to it.
    function dragged(o, price) {
      if (o.triggerPrice === undefined) return { price };
      return o.type === 'SL' ? { price: o.price + price - o.triggerPrice, triggerPrice: price } : { triggerPrice: price };
    }
    broker.onBook((orders, positions) => { book = { orders, positions }; draw(); });
    broker.onLtp((s, ltp) => tc.onLtp(s, ltp));

    // Armed analyzer-mode engine (no confirm dialog in this demo).
    const eng = new OrderEngine({
      feed: broker, armed: true, mode: 'analyzer',
      constraints: { tickSize: 0.05, priceBand: { lower: last * 0.8, upper: last * 1.2 }, freezeQty: 100000 },
    });

    const brokerToClient = new Map();
    async function place(req) {
      const r = await eng.placeOrder(req);
      if (r.ok) { const o = broker.orders(); brokerToClient.set('order:' + o[o.length - 1].id, r.clientId); }
      document.getElementById('log').textContent = r.ok ? `placed ${req.side} ${req.type}: ${r.state}` : `blocked: ${r.reason}`;
      return r;
    }

    document.getElementById('buy').onclick = () => place({ symbol: SYM, side: 'BUY', type: 'MARKET', qty: 10 });
    document.getElementById('sell').onclick = () => place({ symbol: SYM, side: 'SELL', type: 'MARKET', qty: 10 });
    document.getElementById('limit').onclick = () => place({ symbol: SYM, side: 'BUY', type: 'LIMIT', qty: 5, price: last * 0.985 });

    // Dragging a working-order line moves it locally; only the release sends the
    // modify. requestModify writes whenever its interval has passed, so calling it
    // on every move would rest the order at each price the pointer crosses.
    chart.on('drag:cancel', ({ id }) => { if (drafts.delete(id)) draw(); });
    chart.subscribeDrag(
      (id, price) => { if (brokerToClient.has(id)) { drafts.set(id, price); draw(); } },
      (id) => {
        const c = brokerToClient.get(id), price = drafts.get(id);
        const o = book.orders.find((r) => 'order:' + r.id === id);
        drafts.delete(id);
        if (c === undefined || price === undefined || o === undefined) return;
        // Send the fields the preview drew; commitModify resolves once the
        // broker has answered, so the redraw shows where the order now rests.
        const fields = dragged(o, price);
        eng.requestModify(c, fields.price ?? price, fields);
        void eng.commitModify(c).finally(draw);
      },
    );

    // The pill's close segment routes as `order:<id>::close`, which cancels via the engine.
    chart.subscribeClick((id) => {
      if (!id.endsWith('::close')) return;
      const c = brokerToClient.get(id.slice(0, -'::close'.length));
      if (c) { eng.cancelOrder(c); document.getElementById('log').textContent = 'cancelled'; }
    });

    // simulated LTP
    let t = 0;
    setInterval(() => { t++; broker.emitLtp(SYM, last * (1 + Math.sin(t / 9) * 0.015)); }, 120);
    window.__chart = chart; window.__eng = eng;
  </script>
</body>
</html>
